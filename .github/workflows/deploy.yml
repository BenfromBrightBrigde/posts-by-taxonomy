name: Deploy to WordPress.org SVN

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SVN
        run: sudo apt-get install -y subversion

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "PLUGIN_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Checkout WordPress.org SVN
        run: |
          svn checkout --depth=immediates "https://plugins.svn.wordpress.org/posts-by-taxonomy/" svn_repo
          cd svn_repo
          svn update trunk --set-depth=infinity
          svn update --set-depth=infinity tags
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Copy files to SVN trunk
        run: |
          # Copy new files
          cp posts-by-taxonomy.php svn_repo/trunk/
          cp readme.txt svn_repo/trunk/
          cp license.txt svn_repo/trunk/
          cp index.php svn_repo/trunk/
          
          # Copy assets if they exist
          if [ -d "assets" ]; then
            mkdir -p svn_repo/assets
            cp -r assets/* svn_repo/assets/ 2>/dev/null || true
          fi
          
          # Add all new files
          cd svn_repo
          svn add --force . --auto-props --parents -q 2>/dev/null || true

      - name: Create SVN tag
        run: |
          cd svn_repo
          svn cp trunk tags/${{ env.PLUGIN_VERSION }}

      - name: Commit to SVN
        run: |
          cd svn_repo
          svn commit -m "Deploy version ${{ env.PLUGIN_VERSION }}" \
            --username ${{ secrets.SVN_USERNAME }} \
            --password ${{ secrets.SVN_PASSWORD }} \
            --no-auth-cache
