name: Deploy to WordPress.org SVN

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion rsync

      - name: Define plugin version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "PLUGIN_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Checkout WordPress.org SVN repository
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          svn checkout \
            --non-interactive \
            --trust-server-cert \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            https://plugins.svn.wordpress.org/posts-by-taxonomy/ svn_repo

      - name: Clean SVN trunk
        run: |
          find svn_repo/trunk -mindepth 1 -maxdepth 1 \
            ! -name '.svn' \
            -exec rm -rf {} +

      - name: Sync plugin files to SVN trunk
        run: |
          rsync -av --delete \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='vendor/bin' \
            --exclude='svn_repo' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            ./ svn_repo/trunk/ || [[ $? == 24 ]]

      - name: Remove unwanted files from SVN
        run: |
            -m "Deploy version ${PLUGIN_VERSION}"
